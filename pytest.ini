[pytest]
testpaths = tests
pythonpath = .
# pytest's default fd-level capture reassigns the OS stdout/stderr handles, which
# intermittently breaks Tcl interpreter startup on Windows: Tk() then fails with
# 'invalid command name "tcl_findLibrary"' or a bogus "Can't find a usable tk.tcl"
# even though the scripts are on disk. Python-level capture leaves the handles alone.
addopts = --capture=sys
