name: Android debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'tests/**'
      - 'beytarchiver.py'
      - 'beyt_core.py'
      - 'mobile/**'
      - 'requirements*.txt'
      - 'pytest.ini'
      - 'lan_transfer/**'
      - 'scripts/beytarchiver-requirements.txt'
      - '.github/workflows/android-debug.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'tests/**'
      - 'beytarchiver.py'
      - 'beyt_core.py'
      - 'mobile/**'
      - 'requirements*.txt'
      - 'pytest.ini'
      - 'lan_transfer/**'
      - 'scripts/beytarchiver-requirements.txt'
      - '.github/workflows/android-debug.yml'

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Configure SDK cache
        run: echo "ANDROID_USER_HOME=$RUNNER_TEMP/android-user" >> "$GITHUB_ENV"
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            scripts/beytarchiver-requirements.txt
            mobile/requirements.txt
            requirements*.txt
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          validate-wrappers: true
      - name: Prepare Android SDK and test dependencies
        shell: bash
        run: |
          mkdir -p "$ANDROID_USER_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;34.0.0"
          sudo apt-get update
          sudo apt-get install -y xvfb xauth python3-tk
          python -m pip install -r requirements-dev.txt
      - name: Python regression tests including Tk
        run: xvfb-run -a python -m pytest -q
      - name: Android tests, lint and APK
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Prepare APK and checksum
        shell: bash
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/Beytarchiver-4.0.2-debug.apk
          cd artifacts
          sha256sum Beytarchiver-4.0.2-debug.apk > SHA256SUMS
          echo "ARTIFACT_NAME=beytarchiver-android-4.0.2-${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
      - name: Upload test APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-test-reports-${{ github.run_id }}
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

  windows-tests:
    name: Windows x64 desktop and TLS tests
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      BEYT_TLS_REPETITIONS: '30'
      PYTHONIOENCODING: utf-8 # Runner default cp1252 cannot print Turkish diagnostics
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10' # Latest 3.12 Windows installer in actions/python-versions
          architecture: x64
          cache: pip
          cache-dependency-path: |
            scripts/beytarchiver-requirements.txt
            mobile/requirements.txt
            requirements*.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Windows desktop, native memory API and repeated TLS tests
        shell: pwsh
        run: |
          # Pin Tcl/Tk script libraries: the runner's search intermittently fails to
          # source init.tcl, breaking Tk() with 'invalid command name "tcl_findLibrary"'.
          $pythonRoot = Split-Path -Parent (Split-Path -Parent (Get-Command python).Source)
          if (Test-Path (Join-Path $pythonRoot 'Lib\tcl8.6\init.tcl')) {
            $env:TCL_LIBRARY = Join-Path $pythonRoot 'Lib\tcl8.6'
            $env:TK_LIBRARY = Join-Path $pythonRoot 'Lib\tk8.6'
          }
          python -m pytest -q --junitxml=windows-results.xml -o faulthandler_timeout=60
          exit $LASTEXITCODE
      - name: Publish failure diagnostics
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET
          report = Path('windows-results.xml')
          if report.exists():
              root = ET.parse(report).getroot()
              for case in root.iter('testcase'):
                  for tag in ('failure', 'error'):
                      for failure in case.findall(tag):
                          text = (failure.text or '')[-12000:]
                          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                          print(f"::error title={case.get('name')}::{text}")
      - name: Upload Windows test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-test-results-${{ github.run_id }}
          path: windows-results.xml
          if-no-files-found: warn
